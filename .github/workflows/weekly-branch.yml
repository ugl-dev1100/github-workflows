name: Weekly Branch Automation

on:
  schedule:
   - cron: "43 5 * * *"
  workflow_dispatch:

jobs:
  branch-automation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run Script
        env:
          GH_ORG: ${{ secrets.GH_ORG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          QA_SLACK_WEBHOOK: ${{ secrets.QA_SLACK_WEBHOOK }}
        run: python branch_automation.py

      - name: DevOps Crash Alert
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "🚨 Branch Automation FAILED\nRepo: '${{ github.repository }}'\nRun: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'"
          }' \
          ${{ secrets.DEVOPS_SLACK_WEBHOOK }}
